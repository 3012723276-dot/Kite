<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="525px" preserveAspectRatio="none" style="width:1436px;height:525px;background:#FFFFFF;" version="1.1" viewBox="0 0 1436 525" width="1436px" zoomAndPan="magnify"><title>Periodic Refresh Task: Maintained at Activity Boundaries</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="380.4336" x="427.0332" y="20.7803">Periodic Refresh Task: Maintained at Activity Boundaries</text><!--cluster Active--><g id="cluster_Active"><path d="M26.5,47.5 L597.5,47.5 A12.5,12.5 0 0 1 610,60 L610,66.5 L14,66.5 L14,60 A12.5,12.5 0 0 1 26.5,47.5 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="440" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="596" x="14" y="47.5"/><line style="stroke:#181818;stroke-width:0.5;" x1="14" x2="610" y1="66.5" y2="66.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.3545" x="197.8228" y="58.2803">The connection's single periodic task</text></g><g id="Stopped"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.3477" x="690" y="429.5"/><line style="stroke:#181818;stroke-width:0.5;" x1="690" x2="868.3477" y1="467.5" y2="467.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="100.3789" x="728.9844" y="445.2803">No periodic task</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="158.3477" x="700" y="459.2803">periodicRefreshTask = nil</text></g><ellipse cx="1157" cy="298" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN19"><path d="M886.5,391 L886.5,450.5 L868.0957,454.5 L886.5,458.5 L886.5,518 A0,0 0 0 0 886.5,518 L1243.5068,518 A0,0 0 0 0 1243.5068,518 L1243.5068,401 L1233.5068,391 L886.5,391 A0,0 0 0 0 886.5,391 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1233.5068,391 L1233.5068,401 L1243.5068,401 L1233.5068,391 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="96.8208" x="892.5" y="406.0103">Maintained from:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="330.2241" x="892.5" y="419.0103">&#183; activateConnection: after activation, before the first sync</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="308.5215" x="892.5" y="432.0103">&#183; setForeground: maintain first, then sync immediately</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="300.606" x="892.5" y="445.0103">&#183; $isPlaying.removeDuplicates: uses the event value</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="892.5" y="458.0103">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="315.8086" x="892.5" y="471.0103">Paused in the foreground: periodic refresh still needed.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="319.4141" x="892.5" y="484.0103">Playing in the background: periodic refresh still needed.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="286.1714" x="892.5" y="497.0103">Paused in the background: periodic refresh stops.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="336.0068" x="892.5" y="510.0103">Condition still holds and a task exists: kept, not re-created.</text></g><g id="elem_GMN22"><path d="M620.5,47 L620.5,122 L1067.1548,122 L1067.1548,57 L1057.1548,47 L620.5,47 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1057.1548,47 L1057.1548,57 L1067.1548,57 L1057.1548,47 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="315.3579" x="626.5" y="62.0103">Each round is the 20 s wait plus this round's sync time.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="299.876" x="626.5" y="75.0103">It does not start a concurrent transaction every 20 s.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="425.6548" x="626.5" y="88.0103">Stopping the periodic task does not cancel a shared sync already running.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="398.5122" x="626.5" y="101.0103">An old connection's task waking late cannot act on a new connection.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="323.0386" x="626.5" y="114.0103">No schedule is guaranteed while iOS suspends the app.</text></g><g id="Active.Sleeping"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="202.8682" x="192.5" y="159"/><line style="stroke:#181818;stroke-width:0.5;" x1="192.5" x2="395.3682" y1="197" y2="197"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="58.3516" x="264.7583" y="174.7803">Wait 20 s</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.8682" x="202.5" y="188.7803">weak reference to the service</text></g><g id="Active.Check"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="271.3643" x="330.5" y="275"/><line style="stroke:#181818;stroke-width:0.5;" x1="330.5" x2="601.8643" y1="299" y2="299"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3643" x="340.5" y="290.7803">Check liveness, cancellation, connection</text></g><g id="Active.Syncing"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="225.4541" x="66.5" y="429.5"/><line style="stroke:#181818;stroke-width:0.5;" x1="66.5" x2="291.9541" y1="467.5" y2="467.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="148.6064" x="104.9238" y="445.2803">await synchronizeNow()</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="205.4541" x="76.5" y="459.2803">reuses the shared execution task</text></g><ellipse cx="294" cy="82.5" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#181818" points="294,158.9732,298,149.9732,294,153.9732,290,149.9732,294,158.9732" style="stroke:#181818;stroke-width:1.0;"/><path d="M294,96.6845 C294,111.7904 294,133.1066 294,152.9732 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="429.5758,274.8584,424.2838,266.5521,425.4081,272.0961,419.8641,273.2204,429.5758,274.8584" style="stroke:#181818;stroke-width:1.0;"/><path d="M330.4768,209.1765 C359.6658,228.5227 395.3995,252.2066 424.5746,271.5436 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="71.5381" x="403" y="245.5103">wait finished</text><polygon fill="#181818" points="170.9774,429.1626,172.567,419.4429,169.7108,424.3257,164.828,421.4694,170.9774,429.1626" style="stroke:#181818;stroke-width:1.0;"/><path d="M330.3001,322.8807 C325.4755,323.6049 320.6972,324.3135 316,325 C285.8347,329.4086 200.1963,320.1638 180,343 C159.4104,366.2809 162.9592,398.5425 169.4575,423.3583 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="130.8252" x="224.9895" y="355.0103">enabled &amp;&amp; connected</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="216.8042" x="182" y="368.0103">same connectionID and not cancelled</text><polygon fill="#181818" points="192.3494,195.1601,182.7188,193.0984,187.4565,196.1893,184.3655,200.927,192.3494,195.1601" style="stroke:#181818;stroke-width:1.0;"/><path d="M139.2711,429.4693 C88.049,395.3964 9.9424,330.9572 49,275 C81.3547,228.6459 134.4838,207.3321 186.4779,196.3952 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="268.8486" x="51" y="303.5103">same connection and next round not cancelled</text><polygon fill="#181818" points="808.6626,429.2815,818.2785,427.1521,812.6846,426.311,813.5257,420.717,808.6626,429.2815" style="stroke:#181818;stroke-width:1.0;"/><path d="M1156.8793,312.1545 C1156.0388,328.4427 1151.8439,358.3824 1133,373 C1088.114,407.8189 931.9808,373.3029 878,391 C852.6979,399.295 832.1935,411.902 813.4889,425.7169 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="610.0371,121.2928,614.712,129.9614,613.9932,124.3504,619.6042,123.6316,610.0371,121.2928" style="stroke:#181818;stroke-width:1.0;"/><path d="M817.0012,429.3349 C835.3875,417.6877 857.8021,403.554 878,391 C1236.3419,168.2725 1174.3203,333.3926 1097,227 C1023.3782,125.6965 951.7799,164.6508 829,140 C781.3418,130.4315 650.8801,149.7929 611,122 C610.7383,121.8176 610.4806,121.6302 610.2267,121.4379 C610.1633,121.3898 614.8474,125.0106 614.7844,124.9619 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.7134" x="1164.7209" y="239.0103">updatePeriodicRefreshTask(isPlaying:)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="300.1553" x="1127" y="252.0103">[enabled &amp;&amp; connected &amp;&amp; (foreground || isPlaying)]</text><polygon fill="#181818" points="762.3526,429.462,760.3745,419.8139,759.4456,425.3939,753.8656,424.465,762.3526,429.462" style="stroke:#181818;stroke-width:1.0;"/><path d="M610,275 C651.1853,298.3527 658.9491,309.0999 692,343 C718.9306,370.6225 742.2704,401.3585 758.8642,424.5803 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="230.1724" x="561" y="245.5103">condition no longer holds &#8594; cancel + nil</text><polygon fill="#181818" points="788.6525,429.3687,795.4754,422.266,790.3533,424.6668,787.9525,419.5447,788.6525,429.3687" style="stroke:#181818;stroke-width:1.0;"/><path d="M610.0094,120.878 C610.0344,120.9074 610.0594,120.9367 610.0844,120.9659 C610.1846,121.0829 610.2853,121.1992 610.3865,121.3148 C610.5889,121.5461 610.7934,121.7745 611,122 C674.0855,190.855 746.2945,146.1336 793,227 C830.537,291.9919 806.4969,380.0387 790.6935,423.7265 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="277.5005" x="807" y="245.5103">disable / replaced connection / folder lost / deinit</text><polygon fill="#181818" points="726.2561,429.368,719.5336,422.1703,721.6533,427.4149,716.4087,429.5347,726.2561,429.368" style="stroke:#181818;stroke-width:1.0;"/><path d="M436.4021,325.3092 C421.9003,340.0887 410.0636,358.7872 423,373 C451.6967,404.5282 572.471,381.3627 614,391 C652.6416,399.9672 688.8879,413.5118 720.7328,427.0243 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="265.2051" x="425" y="361.5103">cancelled / service released / stale connection</text><polygon fill="#181818" points="689.9759,454.5,680.9759,450.5,684.9759,454.5,680.9759,458.5,689.9759,454.5" style="stroke:#181818;stroke-width:1.0;"/><path d="M291.5033,454.5