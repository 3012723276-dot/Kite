<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="816px" preserveAspectRatio="none" style="width:2039px;height:816px;background:#FFFFFF;" version="1.1" viewBox="0 0 2039 816" width="2039px" zoomAndPan="magnify"><title>Connection Authorization and Recovery</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="266.7998" x="752.6001" y="20.7803">Connection Authorization and Recovery</text><g id="Disconnected"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="130.1338" x="1643" y="108"/><line style="stroke:#181818;stroke-width:0.5;" x1="1643" x2="1773.1338" y1="146" y2="146"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="84.8271" x="1665.6533" y="123.7803">Disconnected</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="110.1338" x="1653" y="137.7803">connected = false</text></g><g id="Connecting"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="200.5508" x="1193.5" y="249.5"/><line style="stroke:#181818;stroke-width:0.5;" x1="1193.5" x2="1394.0508" y1="287.5" y2="287.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="70.8271" x="1258.3618" y="265.2803">Connecting</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="180.5508" x="1203.5" y="279.2803">captures a new connectionID</text></g><g id="Picker"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="209.875" x="1489" y="429.5"/><line style="stroke:#181818;stroke-width:0.5;" x1="1489" x2="1698.875" y1="467.5" y2="467.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.875" x="1499" y="445.2803">Waiting for folder authorization</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="132.2891" x="1527.793" y="459.2803">enable() returns false</text></g><g id="Connected"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="226.2607" x="6" y="429.5"/><line style="stroke:#181818;stroke-width:0.5;" x1="6" x2="232.2607" y1="467.5" y2="467.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="67.7168" x="85.272" y="445.2803">Connected</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.2607" x="16" y="459.2803">enabled = true / connected = true</text></g><g id="Failed"><rect fill="#F1F1F1" height="62" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="215.7197" x="751" y="571"/><line style="stroke:#181818;stroke-width:0.5;" x1="751" x2="966.7197" y1="623" y2="623"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1582" x="822.2808" y="586.7803">Unavailable</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="195.7197" x="761" y="600.7803">connected = false / error shown</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="193.3613" x="762.1792" y="614.7803">enabled keeps the user's intent</text></g><g id="Disabled"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="237.1572" x="740.5" y="686"/><line style="stroke:#181818;stroke-width:0.5;" x1="740.5" x2="977.6572" y1="724" y2="724"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="54.4756" x="831.8408" y="701.7803">Disabled</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="217.1572" x="750.5" y="715.7803">enabled = false / connected = false</text></g><ellipse cx="1708" cy="57" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN25"><path d="M1412.5,211 L1412.5,270.5 L1394.7754,274.5 L1412.5,278.5 L1412.5,338 A0,0 0 0 0 1412.5,338 L1763.0068,338 A0,0 0 0 0 1763.0068,338 L1763.0068,221 L1753.0068,211 L1412.5,211 A0,0 0 0 0 1412.5,211 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1753.0068,211 L1753.0068,221 L1763.0068,221 L1753.0068,211 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="323.0322" x="1418.5" y="226.0103">invalidateConnection runs before every new connection:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="329.5068" x="1418.5" y="239.0103">1. new connectionID; clear remote lists and pending work</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="273.8696" x="1418.5" y="252.0103">2. cancel coalescing / execution / periodic tasks</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="325.2222" x="1418.5" y="265.0103">3. invalidate continue requests and publication baselines</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="278.2178" x="1418.5" y="278.0103">4. disconnect the previous repository connection</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="1418.5" y="291.0103">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="1418.5" y="304.0103">enable: bookmark &#8594; restore; otherwise try the container.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="282.5469" x="1418.5" y="317.0103">connect: the picked root or its Kite subfolder.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="299.8887" x="1418.5" y="330.0103">restore never re-creates a deleted authorized folder.</text></g><g id="elem_GMN28"><path d="M425.5,404 L425.5,450.5 L232.4277,454.5 L425.5,458.5 L425.5,505 A0,0 0 0 0 425.5,505 L822.2495,505 A0,0 0 0 0 822.2495,505 L822.2495,414 L812.2495,404 L425.5,404 A0,0 0 0 0 425.5,404 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M812.2495,404 L812.2495,414 L822.2495,414 L812.2495,404 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="301.3232" x="431.5" y="419.0103">The picked-folder and restore entry points each start</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="375.7495" x="431.5" y="432.0103">one security scope, owned by repository.scopedURL on success.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="267.376" x="431.5" y="445.0103">The iCloud container needs no security scope.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="304.9604" x="431.5" y="458.0103">Released on disconnect or when the entry point fails.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="431.5" y="471.0103">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="320.436" x="431.5" y="484.0103">After every await the operation's connection is checked;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="362.0322" x="431.5" y="497.0103">a stale operation can neither activate nor clear its replacement.</text></g><g id="elem_GMN31"><path d="M655,773 L655,809 A0,0 0 0 0 655,809 L1063.3213,809 A0,0 0 0 0 1063.3213,809 L1063.3213,783 L1053.3213,773 L863,773 L859,736.2521 L855,773 L655,773 A0,0 0 0 0 655,773 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1053.3213,773 L1053.3213,783 L1063.3213,783 L1053.3213,773 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="375.7559" x="661" y="788.0103">A plain disable does not withdraw cloud files or sign out remotely.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="387.3213" x="661" y="801.0103">The local account, playback restore and saved preferences remain.</text></g><polygon fill="#181818" points="1708,107.7245,1712,98.7245,1708,102.7245,1704,98.7245,1708,107.7245" style="stroke:#181818;stroke-width:1.0;"/><path d="M1708,71.25 C1708,80.9795 1708,89.3837 1708,101.7245 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1330.0622,249.4827,1339.8152,248.1119,1334.3041,246.8358,1335.5802,241.3248,1330.0622,249.4827" style="stroke:#181818;stroke-width:1.0;"/><path d="M1642.707,145.1157 C1579.8184,157.0596 1482.7522,178.7792 1403,211 C1377.5159,221.2959 1355.8029,233.421 1335.1525,246.3065 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="181.3843" x="1504" y="188.0103">enable / connect (picked folder)</text><polygon fill="#181818" points="1307.5534,299.7475,1308.156,309.5779,1309.8598,304.1838,1315.254,305.8876,1307.5534,299.7475" style="stroke:#181818;stroke-width:1.0;"/><path d="M977.7797,707.0422 C1037.6689,702.3447 1110.4564,691.646 1172,668 C1256.4647,635.5473 1297.794,633.0382 1340,553 C1384.7599,468.1187 1336.4719,355.3706 1310.3211,305.071 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="74.458" x="1354" y="541.5103">enable again</text><polygon fill="#181818" points="1595.803,429.1622,1599.8863,420.1996,1595.8494,424.1624,1591.8866,420.1254,1595.803,429.1622" style="stroke:#181818;stroke-width:1.0;"/><path d="M1327.6174,299.6646 C1348.3364,313.2778 1376.0231,329.2583 1403,338 C1438.9287,349.6425 1543.7932,330.8844 1572,356 C1592.3468,374.117 1596.0671,400.6837 1595.8586,423.1624 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="254.3823" x="1592" y="374.5103">no saved bookmark and no iCloud container</text><polygon fill="#181818" points="1311.5397,299.5799,1313.5569,309.22,1314.4632,303.6362,1320.047,304.5425,1311.5397,299.5799" style="stroke:#181818;stroke-width:1.0;"/><path d="M1488.725,437.9513 C1448.5857,428.0843 1404.2881,412.0365 1370,386 C1357.4306,376.4555 1359.7853,369.1113 1351,356 C1338.1314,336.7947 1326.4921,320.3262 1315.0479,304.4475 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="194.3589" x="1372" y="374.5103">user picks a folder &#8594; connect(to:)</text><polygon fill="#181818" points="1740.6682,158.2873,1745.2332,167.0143,1744.5853,161.3947,1750.205,160.7468,1740.6682,158.2873" style="stroke:#181818;stroke-width:1.0;"/><path d="M1699.2812,439.1559 C1761.9366,428.2204 1832.8665,410.7834 1852,386 C1911.4303,309.0208 1804.1055,208.6102 1745.3688,162.0162 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="159.7134" x="1871" y="278.0103">authorization not completed</text><polygon fill="#181818" points="191.1983,429.3982,200.9895,430.463,195.9601,427.8734,198.5497,422.8441,191.1983,429.3982" style="stroke:#181818;stroke-width:1.0;"/><path d="M1193.1991,279.6675 C1036.9504,287.3977 727.3552,307.7916 469,356 C371.3385,374.2234 267.081,405.0987 196.9125,427.5684 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="238.4624" x="537.8186" y="368.0103">device identity, folder and repository valid</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="372.0996" x="471" y="381.0103">activate &#8594; periodic task &#8594; folder observation &#8594; immediate sync</text><polygon fill="#181818" points="851.5865,570.9285,853.7326,561.3163,850.6002,566.0268,845.8898,562.8943,851.5865,570.9285" style="stroke:#181818;stroke-width:1.0;"/><path d="M1193.1398,292.8158 C1081.81,314.1435 913.0006,353.7947 873,404 C834.8618,451.8679 841.9185,522.8777 850.403,565.0464 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="226.186" x="875" y="458.0103">restore / authorization / validation failed</text><polygon fill="#181818" points="232.1898,466.9321,241.8598,468.8004,237.0611,465.805,240.0565,461.0063,232.1898,466.9321" style="stroke:#181818;stroke-width:1.0;"/><path d="M232.1898,442.0679 C243.0918,444.5903 250,448.7344 250,454.5 C250,460.2656 248.9374,463.0571 238.0354,465.5796 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.2744" x="266.8027" y="451.5103">ordinary domain error</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.8799" x="252" y="464.5103">record error and retry work</text><polygon fill="#181818" points="750.799,580.6056,742.6551,575.067,745.8789,579.7153,741.2306,582.9392,750.799,580.6056" style="stroke:#181818;stroke-width:1.0;"/><path d="M223.9371,479.6001 C316.7491,500.4821 455.9803,530.7531 578,553 C630.1908,562.5155 643.6843,562.1976 696,571 C713.7344,573.9839 726.6209,576.2306 744.8949,579.5373 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="181.3589" x="621.1995" y="535.0103">sync hits SyncError.unavailable</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="263.7578" x="580" y="548.0103">invalidateConnection &#8594; repository.disconnect</text><polygon fill="#181818" points="1254.1461,299.6607,1244.4305,301.275,1249.9717,302.4129,1248.8339,307.9541,1254.1461,299.6607" style="stroke:#181818;stroke-width:1.0;"/><path d="M967.0012,579.7583 C1014.1115,565.6034 1066.7465,542.4492 1103,505 C1136.1462,470.7605 1111.6804,443.0468 1139,404 C1169.7594,360.0368 1214.3496,325.8979 1249.1368,302.9633 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="137.2935" x="1141" y="458.0103">reconnect / re-authorize</text><polygon fill="#181818" points="1193.4343,277.9873,1184.3281,274.2352,1188.4361,278.1242,1184.5472,282.2322,1193.4343,277.9873" style="stroke:#181818;stroke-width:1.0;"/><path d="M129.0823,429.0854 C140.0893,405.8778 160.0909,372.1866 189,356 C275.3807,307.6341 931.4728,285.1618 1187.4365,278.1516 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="146.6943" x="191" y="374.5103">replace folder / reconnect</text><polygon fill="#181818" points="740.2404,706.9107,731.3811,702.6079,735.2432,706.7412,731.11,710.6033,740.2404,706.9107" style="stroke:#181818;stroke-width:1.0;"/><path d="M130.4771,479.5061 C155.6874,528.7038 221.2941,638.8024 316,668 C392.4071,691.5562 598.8548,702.1154 734.2438,706.7073 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="49.8545" x="251" y="605.5103">disable()</text><polygon fill="#181818" points="859,685.8819,863,676.8819,859,680.8819,855,676.8819,859,685.8819" style="stroke:#181818;stroke-width:1.0;"/><path d="M859,633.0902 C859,649.7796 859,664.2548 859,679.8819 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="49.8545" x="861" y="663.0103">disable()</text><polygon fill="#181818" points="896.1008,685.9811,905.8307,684.455,900.3,683.2669,901.4881,677.7363,896.1008,685.9811" style="stroke:#181818;stroke-width:1.0;"/><path d="M1301.2615,299.6996 C1313.5505,346.1407 1332.3305,448.1872 1280,505 C1260.9865,525.642 1181.3316,513.2917 1155,523 C1140.9202,528.1911 977.4285,633.4157 901.1399,682.7241 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.0488" x="1157" y="541.5103">superseded by turning sync off</text><polygon fill="#181818" points="740.2489,708.3493,731.477,703.8711,735.2561,708.0804,731.0468,711.8595,740.2489,708.3493" style="stroke:#181818;stroke-width:1.0;"/><path d="M161.7128,479.5135 C200.3627,501.7913 258.3561,536.6009 306,571 C340.7872,596.1165 340.9705,615.1763 380,633 C495.1159,685.5703 634.1144,702.6335 734.2576,708.0266 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.1479" x="493.6394" y="599.0103">iCloud identity changed</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="358.4268" x="382" y="612.0103">also clears login sharing consent, bookmark and identity token</text><!--SRC=[TLRRZYCr47tlhoZsXHaqan6Nfun0Miso0e4GMbZnmF3WT5VILjnsOxiJmWVm0NmYNy8fkozE9lCmKgVRf-fKrQdZ-QJtQjSfCkhaXaYXuwYigi9UsrvvrL73MpMO-DxP-9FgcBvZS-2ew_9CQ5NZZjhkQAjCu2hgQ9YUdBLSH-qilHrYwxp-MwLVoZRqWMjtO7-ggX1LP7hpJeSw0xXvjlCZVPrZlY4Lg3mpuQOiTWUKwkFWEP0YoqUgPmBVlqluvUo4_atfc7WxZp_Ji2TLSdssRDN6yCqjUKPi6mewF-jwp_w2YB3F6E4U_S3qG6KvygfaivJoqQg3qaQmLpg0CEmzU8RM7UsIPC_S1uejqn3O