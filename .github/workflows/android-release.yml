name: Android APK Release

# 安卓版打包：Kotlin + Compose 工程在 android/ 目录。
# 第一版出 Debug APK（Gradle 自动用 debug key 签名，可直接安装），
# 后续要上架 / 企业分发时再换成正式签名 keystore + secrets。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (without the leading v)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 注意：不要再用 android-actions/setup-android@v3，
      # 它在新版 ubuntu runner 上会因为找不到 'tools' 包而 sdkmanager 退出 1，
      # 这就是 Android #1 失败的原因。ubuntu-latest 自带 Android SDK，
      # Gradle 直接用 runner 预装的 ANDROID_HOME 即可。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        working-directory: android
        run: |
          # 本地用 Android Studio 打开工程后请提交 gradlew / gradle/wrapper，
          # 之后可把下面改回 ./gradlew assembleDebug；当前先用系统 Gradle。
          if [ -f gradlew ]; then ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi

      - name: Create GitHub release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK: $APK"
          ls -lh "$APK"
          gh release create "android-v$VERSION" \
            --title "Kite Android $VERSION" \
            --notes "Kite Android $VERSION

          Debug APK for Android 8.0+. Install directly on your phone.
          This is an early Android build: home, search, login, playlists, player and lyrics are included; Stem / AutoMix / offline downloads are still in progress." \
            "$APK" || gh release upload "android-v$VERSION" "$APK" --clobber
