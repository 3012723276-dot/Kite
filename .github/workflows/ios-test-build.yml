name: iOS Test IPA Build

# TEMPORARY test-only workflow on test/0.1.7-beta4.
# It builds an unsigned IPA and uploads it as a workflow artifact.
# It deliberately does NOT create a GitHub release, tag, or touch main.
# Push trigger is included only because GitHub's web UI cannot run a
# workflow_dispatch workflow that exists only on a non-default branch;
# the trigger is limited to this test branch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test version, e.g. 0.1.6 (without the leading v)"
        required: true
        default: "0.1.7-Beta4"
  push:
    branches: [test/0.1.7-beta4]
permissions:
  contents: read
jobs:
  ios-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="0.1.7-Beta4"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Build unsigned iOS app
        run: |
          xcodebuild -workspace ios/KiteIOS.xcworkspace -scheme KiteIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
      - name: Copy localization tables into app
        run: |
          cp -R Sources/Kite/Resources/*.lproj \
            "$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KiteIOS.app/"
          ls "$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KiteIOS.app/" | grep lproj
      - name: Package IPA
        run: |
          mkdir -p dist "$RUNNER_TEMP/payload/Payload"
          cp -R "$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KiteIOS.app" \
            "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/dist/Kite-iOS-$VERSION-test.ipa" Payload)
          ls -lh dist/
      - name: Upload test IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kite-ios-test-ipa
          path: dist/Kite-iOS-*.ipa
          if-no-files-found: error
