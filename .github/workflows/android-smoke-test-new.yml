name: Android Smoke Test

# 在 GitHub runner 的安卓模拟器上装 APK、启动、截图，验证能不能打开。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Android release version to test, e.g. 0.1.0 (without android-v prefix)"
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download APK from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "android-v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "app-debug.apk" \
            --dir /tmp/apk
          ls -lh /tmp/apk/

      - name: Run emulator and smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            adb install /tmp/apk/app-debug.apk
            adb shell am start -n dev.yuxinqiao.kumone/.MainActivity
            sleep 25
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png /tmp/screen.png
            adb shell dumpsys window windows | grep -i "mCurrentFocus\|mFocusedApp" || true
            ls -lh /tmp/screen.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-screenshot
          path: /tmp/screen.png
