# XcodeGen manifest for the iOS app shell.
# Regenerate the project with: cd ios && xcodegen generate
name: KiteIOS
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  KiteIOSPackage:
    path: KiteIOSPackage
targets:
  KiteIOS:
    type: application
    platform: iOS
    sources:
      - KiteIOS
      - path: ../Sources/Kite/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: KiteIOSPackage
        product: KiteIOSFeature
      - target: KiteLyricsWidget
    settings:
      base:
        # CODE_SIGN_ENTITLEMENTS is deliberately NOT set here. Target-level build
        # settings override xcconfig, which would pin the entitlements file and
        # silently defeat the CarPlay overlay in Config/Shared.xcconfig. The
        # setting lives there instead, behind $(KITE_ENTITLEMENTS_FILE).
        ENABLE_PREVIEWS: YES
  KiteLyricsWidget:
    type: app-extension
    platform: iOS
    sources:
      - KiteLyricsWidget
      # Shared with the app: the Live Activity attributes type must be the
      # same type in both processes for ActivityKit to pair them.
      - path: ../Sources/Kite/Core/Player/LockScreenLyricsAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sb.moe.kite.lyricswidget
        INFOPLIST_FILE: KiteLyricsWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        SKIP_INSTALL: YES
  KiteIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KiteIOSUITests
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
    dependencies:
      - target: KiteIOS
schemes:
  KiteIOS:
    build:
      targets:
        KiteIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KiteIOSUITests
    archive:
      config: Release
